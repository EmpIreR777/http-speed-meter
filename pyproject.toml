[project]
name = "http-speed-meter"
version = "0.1.0"
description = "Замерятель скорости интернета: последовательные HTTP-запросы, среднее время, объём и МБ/с."
readme = "README.md"
authors = [
    { name = "Кирилл Юрьевич", email = "Kirill.tanatos1993@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
http-speed-meter = "http_speed_meter.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific rules
]
ignore = [
    # Тексты и документация на русском языке: предупреждения о «похожих»
    # кириллических и латинских символах здесь только мешают.
    "RUF001",
    "RUF002",
    "RUF003",
]

